<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B1120" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#BAE6FD" />
      <stop offset="50%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#4338CA" />
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="#222222" stroke-width="2" />
  
  <!-- Left Solar Ring -->
  <circle cx="38" cy="50" r="24" stroke="url(#sunGrad)" stroke-width="7" />
  
  <!-- Right Lunar Ring -->
  <circle cx="62" cy="50" r="24" stroke="url(#moonGrad)" stroke-width="7" />
  
  <!-- Interlocking Nuclei -->
  <circle cx="38" cy="50" r="4.5" fill="#FDE047" />
  <circle cx="62" cy="50" r="4.5" fill="#BAE6FD" />
  <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
</svg>
